<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click The Tile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a0b2e, #3b185f, #a12568);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      width: 360px;
      height: 600px;
      background: #120822;
      border: 3px solid #ff4d94;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(255, 77, 148, 0.5);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #hud {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }
    #score {
      font-size: 46px;
      font-weight: 800;
      color: #ff85b3;
      text-shadow: 0 0 12px rgba(255, 77, 148, 0.8);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 8, 34, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      background: linear-gradient(to right, #ff4d94, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 25px;
    }
    .action-btn {
      width: 85%;
      padding: 14px 20px;
      margin: 8px 0;
      border: 1px solid #ff4d94;
      border-radius: 10px;
      background: rgba(255, 77, 148, 0.2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #ff4d94;
      transform: scale(1.04);
      box-shadow: 0 0 15px rgba(255, 77, 148, 0.7);
    }
    .controls-hint {
      margin-top: 25px;
      font-size: 12px;
      color: #aaa;
    }
    .key-badge {
      display: inline-block;
      padding: 3px 8px;
      border: 1px solid #777;
      border-radius: 4px;
      margin: 0 3px;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <div id="score">0</div>
  </div>

  <!-- Menu Awal -->
  <div id="start-screen" class="overlay">
    <h1>✨ CLICK THE TILE ✨</h1>
    <p class="subtitle">Klik semua ubin neon sebelum lewat batas bawah!</p>
    
    <button class="action-btn" onclick="startGame()">MULAI MAIN</button>

    <div class="controls-hint">
      Klik ubin atau gunakan keyboard:<br><br>
      <span class="key-badge">D</span>
      <span class="key-badge">F</span>
      <span class="key-badge">J</span>
      <span class="key-badge">K</span>
    </div>
  </div>

  <!-- Menu Game Over -->
  <div id="gameover-screen" class="overlay hidden">
    <h1>GAME OVER 💔</h1>
    <p class="subtitle" id="final-score-text">Skor Akhir: 0</p>
    <button class="action-btn" onclick="startGame()">🔄 MAIN LAGI</button>
  </div>

  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const finalScoreText = document.getElementById('final-score-text');

  // Audio Context untuk efek suara piano sintetis
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  // Tangga nada (Do Re Mi Fa Sol La Si Do)
  const PIANO_NOTES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];

  const COLS = 4;
  const COL_WIDTH = canvas.width / COLS;
  const TILE_HEIGHT = 135;
  const KEY_MAP = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
  const KEY_LABELS = ['D', 'F', 'J', 'K'];

  let tiles = [];
  let score = 0;
  let speed = 4.5;
  let isPlaying = false;
  let noteStep = 0;
  let animationId;
  let flashEffects = [];

  function playNoteSound(freq) {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.45);
  }

  function playErrorSound() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function spawnTile(yOffset) {
    const col = Math.floor(Math.random() * COLS);
    tiles.push({
      col: col,
      y: yOffset,
      hit: false
    });
  }

  function startGame() {
    tiles = [];
    flashEffects = [];
    score = 0;
    speed = 4.5;
    noteStep = 0;
    isPlaying = true;

    scoreEl.innerText = score;
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');

    for (let i = 0; i < 5; i++) {
      spawnTile(-TILE_HEIGHT * (i + 1));
    }

    cancelAnimationFrame(animationId);
    gameLoop();
  }

  function triggerGameOver() {
    isPlaying = false;
    playErrorSound();
    finalScoreText.innerText = `Skor Akhir: ${score}`;
    gameoverScreen.classList.remove('hidden');
  }

  function handleInput(col) {
    if (!isPlaying) return;

    const targetTile = tiles.find(t => !t.hit);

    if (targetTile && targetTile.col === col && targetTile.y + TILE_HEIGHT > 0) {
      targetTile.hit = true;
      score++;
      scoreEl.innerText = score;

      // Bunyikan nada berurutan saat ubin ditekan
      playNoteSound(PIANO_NOTES[noteStep % PIANO_NOTES.length]);
      noteStep++;

      // Tambah kecepatan setiap 10 skor
      if (score % 10 === 0) {
        speed += 0.35;
      }

      // Efek kilatan neon
      flashEffects.push({
        col: col,
        y: targetTile.y,
        alpha: 0.8
      });
    } else {
      triggerGameOver();
    }
  }

  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const col = Math.floor(x / COL_WIDTH);
    handleInput(col);
  });

  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (KEY_MAP.hasOwnProperty(key)) {
      handleInput(KEY_MAP[key]);
    }
  });

  function gameLoop() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Garis pemisah 4 kolom
    ctx.strokeStyle = 'rgba(255, 77, 148, 0.25)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * COL_WIDTH, 0);
      ctx.lineTo(i * COL_WIDTH, canvas.height);
      ctx.stroke();
    }

    // Petunjuk huruf di bawah
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i < COLS; i++) {
      ctx.fillText(KEY_LABELS[i], i * COL_WIDTH + COL_WIDTH / 2, canvas.height - 20);
    }

    // Update & gambar tiles
    for (let i = 0; i < tiles.length; i++) {
      let t = tiles[i];
      t.y += speed;

      if (!t.hit) {
        const grad = ctx.createLinearGradient(0, t.y, 0, t.y + TILE_HEIGHT);
        grad.addColorStop(0, '#ff4d94');
        grad.addColorStop(1, '#9d4edd');

        ctx.fillStyle = grad;
        ctx.fillRect(t.col * COL_WIDTH + 3, t.y + 2, COL_WIDTH - 6, TILE_HEIGHT - 4);

        ctx.strokeStyle = '#ffb3d1';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(t.col * COL_WIDTH + 3, t.y + 2, COL_WIDTH - 6, TILE_HEIGHT - 4);

        if (t.y > canvas.height) {
          triggerGameOver();
          return;
        }
      } else {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fillRect(t.col * COL_WIDTH + 3, t.y + 2, COL_WIDTH - 6, TILE_HEIGHT - 4);
      }
    }

    // Efek kilatan saat ubin diklik
    for (let i = flashEffects.length - 1; i >= 0; i--) {
      let f = flashEffects[i];
      ctx.fillStyle = `rgba(255, 182, 217, ${f.alpha})`;
      ctx.fillRect(f.col * COL_WIDTH, f.y, COL_WIDTH, TILE_HEIGHT);
      f.alpha -= 0.06;
      if (f.alpha <= 0) flashEffects.splice(i, 1);
    }

    if (tiles.length > 0 && tiles[0].y > canvas.height + 50) {
      tiles.shift();
    }
    const highestTile = tiles[tiles.length - 1];
    if (highestTile && highestTile.y >= 0) {
      spawnTile(highestTile.y - TILE_HEIGHT);
    }

    animationId = requestAnimationFrame(gameLoop);
  }
</script>

</body>
</html>
